services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER}']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      # Сайт отдаётся только по HTTPS через Caddy — cookie должна быть Secure.
      COOKIE_SECURE: 'true'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Портов на хост нет: наружу контейнер доступен только через Caddy
    # (сеть web) по https://smartalise.ru.
    networks:
      default:
      # Внешняя сеть общего реверс-прокси Caddy (создана проектом smarthome).
      # Через неё Caddy проксирует smartalise.ru на этот контейнер.
      web:
        aliases:
          - happy-edu-frontend

volumes:
  postgres_data:

networks:
  web:
    external: true
